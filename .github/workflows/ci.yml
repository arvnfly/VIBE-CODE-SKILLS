name: CI & Skills Verification

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Skills & Manifests Structure
        run: |
          for f in base-rules.md AGENTS.md CLAUDE.md PI.md CODEX.md GEMINI.md .cursorrules .windsurfrules .aider.conf.yml README.md LICENSE; do
            test -f "$f" || { echo "Missing $f"; exit 1; }
          done

          for s in subagent-council subagent-helper subagent-driven-development verification-before-completion systematic-debugging; do
            test -f "skills/$s/SKILL.md" || { echo "Missing skills/$s/SKILL.md"; exit 1; }
            grep -q "^name: $s" "skills/$s/SKILL.md" || { echo "Invalid frontmatter in $s"; exit 1; }
          done

          echo "All vibe-code skills and files verified successfully."