name: CI & Skills Verification

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Test Suite & Structure Validation
        run: npm test

      - name: Test bash installer script
        run: |
          mkdir -p /tmp/test-dest
          bash ./install.sh /tmp/test-dest
          test -f /tmp/test-dest/base-rules.md
          test -f /tmp/test-dest/skills/subagent-council/SKILL.md
          test -f /tmp/test-dest/.agent/skills/subagent-driven-development/SKILL.md
          test -f /tmp/test-dest/skills/ui-ux/SKILL.md
          test -f /tmp/test-dest/.cursor/rules/council.mdc
          rm -rf /tmp/test-dest
          echo "Installer test passed."

      - name: Test CLI commands and doctor
        run: |
          node bin/vibe-code-skills.js --help
          node bin/vibe-code-skills.js list
          node bin/vibe-code-skills.js doctor .
          mkdir -p /tmp/test-cli-dest
          node bin/vibe-code-skills.js install /tmp/test-cli-dest --client=cursor --dry-run
          node bin/vibe-code-skills.js install /tmp/test-cli-dest --client=cursor
          node bin/vibe-code-skills.js doctor /tmp/test-cli-dest
          node bin/vibe-code-skills.js uninstall /tmp/test-cli-dest
          rm -rf /tmp/test-cli-dest
          echo "CLI tests passed."